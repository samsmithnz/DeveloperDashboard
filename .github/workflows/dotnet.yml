name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DeveloperDashboard.slnx
      - name: Build
        run: dotnet build DeveloperDashboard.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test DeveloperDashboard.slnx --configuration Release --no-build
